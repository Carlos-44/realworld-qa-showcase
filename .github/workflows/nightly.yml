name: Nightly QA Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e_nightly:
    name: E2E Tests (Full Regression)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json
      - name: Start the app stack
        run: docker compose up -d --build
      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost/api/tags > /dev/null && exit 0
            sleep 3
          done
          docker compose logs
          exit 1
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        continue-on-error: true # the reporter step below decides pass or fail
      - name: Show app logs
        if: always()
        run: docker compose logs --tail=50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-e2e-results
          path: |
            test-results/e2e-results.xml
            reports/playwright-report/
            e2e/test-results/
          retention-days: 30
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Nightly E2E Tests
          path: test-results/e2e-results.xml
          reporter: java-junit
          fail-on-error: true

  publish_report:
    name: Publish Nightly Report to GitHub Pages
    needs: e2e_nightly
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nightly-e2e-results
          path: nightly-report/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: nightly-report/reports/playwright-report
          destination_dir: reports/nightly

  nightly_summary:
    name: Nightly Pipeline Summary
    needs: [e2e_nightly, publish_report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        env:
          E2E: ${{ needs.e2e_nightly.result }}
          PUBLISH: ${{ needs.publish_report.result }}
        run: |
          {
            echo "## Nightly QA Pipeline Summary"
            echo "| Stage | Status |"
            echo "| --- | --- |"
            echo "| E2E Tests (Nightly) | $E2E |"
            echo "| Publish Report | $PUBLISH |"
            echo ""
            echo "Report: https://carlos-44.github.io/realworld-qa-showcase/reports/nightly"
          } >> "$GITHUB_STEP_SUMMARY"
