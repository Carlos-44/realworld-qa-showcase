name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit_tests:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
        continue-on-error: true # the reporter step below decides pass or fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/unit-results.xml
          retention-days: 14
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests
          path: test-results/unit-results.xml
          reporter: java-junit
          fail-on-error: true

  compile:
    name: Compile Frontend
    needs: unit_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  smoke_tests:
    name: Smoke Tests (Docker Stack)
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json
      - name: Start the app stack
        run: docker compose up -d --build
      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost/api/tags > /dev/null && exit 0
            sleep 3
          done
          docker compose logs
          exit 1
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test --grep "\[smoke\]"
        working-directory: e2e
        continue-on-error: true # the reporter step below decides pass or fail
      - name: Show app logs
        if: always()
        run: docker compose logs --tail=50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: |
            test-results/e2e-results.xml
            reports/playwright-report/
            e2e/test-results/
          retention-days: 14
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Smoke Tests
          path: test-results/e2e-results.xml
          reporter: java-junit
          fail-on-error: true

  build_docker:
    name: Build & Push Docker Image
    needs: smoke_tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ghcr.io/carlos-44/realworld-qa-showcase/frontend:latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ghcr.io/carlos-44/realworld-qa-showcase/backend:latest

  pipeline_summary:
    name: Pipeline Summary
    needs: [unit_tests, compile, smoke_tests, build_docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        env:
          UNIT: ${{ needs.unit_tests.result }}
          COMPILE: ${{ needs.compile.result }}
          SMOKE: ${{ needs.smoke_tests.result }}
          DOCKER: ${{ needs.build_docker.result }}
        run: |
          {
            echo "## CI Pipeline Summary"
            echo "| Stage | Status |"
            echo "| --- | --- |"
            echo "| Unit & Component Tests | $UNIT |"
            echo "| Compile Frontend | $COMPILE |"
            echo "| Smoke Tests | $SMOKE |"
            echo "| Build & Push Docker | $DOCKER |"
          } >> "$GITHUB_STEP_SUMMARY"
